name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Domain Unit Tests
        run: ./gradlew :domain:test --console=plain --stacktrace

      - name: Run App Unit Tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace 2>&1 | tee app_test.log

      - name: Publish Test Output to Summary
        if: always()
        run: |
          echo "## App Test Log Output" >> $GITHUB_STEP_SUMMARY
          if [ -f app_test.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 250 app_test.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/**'

      - name: Upload App Test Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-log
          path: app_test.log

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --console=plain --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tidemark-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
