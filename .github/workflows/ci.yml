name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Domain Unit Tests
        run: ./gradlew :domain:test --console=plain --stacktrace

      - name: Run App Unit Tests
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --console=plain --stacktrace > app_test.log 2>&1
          EXIT_CODE=$?
          echo "## App Unit Tests Log (exit code $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 app_test.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat app_test.log
          exit $EXIT_CODE

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/**'

      - name: Run Android Lint
        run: |
          set +e
          ./gradlew :app:lintDebug --console=plain --stacktrace > lint.log 2>&1
          EXIT_CODE=$?
          echo "## Android Lint Log (exit code $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 lint.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat lint.log
          exit $EXIT_CODE

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tidemark-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
